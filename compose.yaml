services:
  gatekeeper:
    build: .
    image: gatekeeper-allowlist:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/allowlist.db
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - gatekeeper-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      gatekeeper:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  gatekeeper-data:
  caddy-data:
  caddy-config:
